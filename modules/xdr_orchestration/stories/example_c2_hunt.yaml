# Example data-driven story (Tier-2 #4). Drop a .yaml here and it registers as a
# runnable story on next load — no Python. The built-in Python stories are the
# validated canon; files like this ADD to them (or override a built-in by id).
#
# Only use technique ids your box already has prereqs for (the built-ins cover the
# validated palette), and network module/event names the modules actually emit.
# expected_alerts drive the post-run scorecard; mitre drives the coverage map
# (it is auto-filled from the technique catalog when omitted).

id: xdr_c2_hunt
name: "XDR C2 Hunt (YAML): recon + layered beacon to one domain"
tactics: [Discovery, Command and Control]
anchor_dhcp: true
anchor_logon: true
steps:
  - narrative: "Discovery — System Owner/User (whoami)."
    technique: T1033

  - narrative: "Command & Control — recon paired with a DNS beacon, DNS tunnel, web C2 and perimeter egress to one domain."
    technique: {id: T1082, test_numbers: "1"}
    params: {domain: hunt-beacon-cdn.net, protocol: https, port: 443}
    expected_alerts: ["Command and Control", "C2", "Beacon", "DNS Tunnel"]
    post_delay: 2.0
    network:
      - {module: Infoblox NIOS, event: C2_BEACON, context: {domain: hunt-beacon-cdn.net}}
      - {module: Infoblox NIOS, event: DNS_TUNNEL}
      - {module: Zscaler Web Gateway, event: web_c2_beacon, external: true, context: {domain: hunt-beacon-cdn.net}}
      - {module: Cisco Firepower, event: C2_EGRESS, context: {domain: hunt-beacon-cdn.net}}
      - {module: Fortinet FortiGate, event: C2_EGRESS, context: {domain: hunt-beacon-cdn.net}}
